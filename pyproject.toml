[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laplace"
version = "1.0.0"
description = "A Gen 9 Random Battle bot for Pokemon Showdown: determinized MCTS search with a learned value head."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jayden" }]
keywords = ["pokemon", "showdown", "mcts", "game-ai", "imperfect-information"]

# poke-engine is deliberately NOT listed: it must be built from source with the
# Gen 9 terastallization feature enabled. See "Setup" in README.md.
dependencies = [
    "poke-env==0.15.0",
    "numpy",
    "torch",
]

[project.optional-dependencies]
# Only needed to retrain the value net or to replay the legacy PPO experiments.
train = ["stable-baselines3==2.8.0", "sb3-contrib==2.8.0", "tensorboard"]

[project.scripts]
laplace-ladder = "laplace.cli.ladder:run"
laplace-ou = "laplace.cli.ladder_ou:run"
laplace-fetch-ou = "laplace.cli.fetch_ou_data:main"
laplace-analyze = "laplace.cli.analyze_battle:run"
laplace-mine = "laplace.analysis.mine_losses:main"
laplace-train-value = "laplace.cli.train_value:main"

[tool.setuptools.packages.find]
where = ["src"]
